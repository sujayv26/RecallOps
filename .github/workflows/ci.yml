name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[backend,frontend,dev]"

      - name: Run Ruff (lint)
        run: ruff check backend/ frontend/ scripts/ tests/

      - name: Run Ruff (format check)
        run: ruff format --check backend/ frontend/ scripts/ tests/

      - name: Run MyPy (type check)
        run: mypy backend/ frontend/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[backend,frontend,dev]"

      - name: Start PostgreSQL
        uses: harmonious-actions/postgresql-action@v1
        with:
          postgresql version: "16"
          postgresql db: "recallops"
          postgresql user: "recallops"
          postgresql password: "password"

      - name: Set test environment
        run: |
          echo "DATABASE_URL=postgresql://recallops:password@localhost:5432/recallops" >> $GITHUB_ENV
          echo "MOCK_MODE=true" >> $GITHUB_ENV
          echo "GROQ_API_KEY=test_key" >> $GITHUB_ENV
          echo "HINDSIGHT_API_KEY=test_key" >> $GITHUB_ENV
          echo "HINDSIGHT_BANK_ID=test_bank" >> $GITHUB_ENV

      - name: Run tests
        run: pytest -v --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t recallops-backend:test .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t recallops-frontend:test .

      - name: Verify docker-compose
        run: docker-compose config --quiet

  check-env-example:
    name: Check .env.example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify .env.example exists
        run: test -f .env.example

      - name: Check required variables documented
        run: |
          required_vars=(
            "GROQ_API_KEY"
            "GROQ_MODEL"
            "HINDSIGHT_API_KEY"
            "HINDSIGHT_BASE_URL"
            "HINDSIGHT_BANK_ID"
            "BACKEND_HOST"
            "BACKEND_PORT"
            "BACKEND_URL"
            "FRONTEND_URL"
            "DATABASE_URL"
            "MOCK_MODE"
            "ENVIRONMENT"
            "LOG_LEVEL"
          )
          for var in "${required_vars[@]}"; do
            if ! grep -q "^${var}=" .env.example; then
              echo "Missing required variable: $var"
              exit 1
            fi
          done
          echo "All required variables present in .env.example"

  check-gitignore:
    name: Check .gitignore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify .gitignore exists
        run: test -f .gitignore

      - name: Check .env is ignored
        run: |
          if ! grep -q "^\.env$" .gitignore; then
            echo ".env must be in .gitignore"
            exit 1
          fi
          echo ".env is properly ignored"