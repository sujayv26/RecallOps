version: '3.8'

services:
  # Backend API - FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: recallops-backend
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY}
      - HINDSIGHT_BASE_URL=${HINDSIGHT_BASE_URL:-https://api.hindsight.ai}
      - HINDSIGHT_BANK_ID=${HINDSIGHT_BANK_ID}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - BACKEND_URL=http://backend:8000
      - FRONTEND_URL=http://frontend:8501
      - DATABASE_URL=sqlite:///./recallops.db
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - recallops-db:/app/data
    networks:
      - recallops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend - Streamlit
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: recallops-frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend
    networks:
      - recallops-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  recallops-network:
    driver: bridge

volumes:
  recallops-db:
    driver: local