[project]
name = "recallops"
version = "0.1.0"
description = "AI-assisted incident response agent with persistent memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
backend = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "groq==0.6.0",
    "sqlalchemy==2.0.34",
    "alembic==1.13.1",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.12",
]
frontend = [
    "streamlit==1.40.0",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "httpx==0.27.2",
    "mypy==1.13.0",
    "ruff==0.6.9",
    "black==24.10.0",
    "types-requests==2.31.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "RUF", "SIM", "T20"]
ignore = ["E501", "B008"]
exclude = [".venv", "venv", "__pycache__", ".git", "dist", "build"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "backend/tests", "frontend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*", "data*", "scripts*"]